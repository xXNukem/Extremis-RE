name: Windows x64 package

on:
  workflow_dispatch:
  pull_request:

jobs:
  package:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          path: vcpkg
      - uses: actions/cache@v4
        with:
          path: |
            vcpkg/downloads
            vcpkg-binary-cache
          key: vcpkg-windows-x64-${{ hashFiles('vcpkg/versions/baseline.json', 'vcpkg/ports/sdl3/vcpkg.json') }}
          restore-keys: vcpkg-windows-x64-
      - name: Install SDL3
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force vcpkg-binary-cache | Out-Null
          $env:VCPKG_DEFAULT_BINARY_CACHE = "${{ github.workspace }}/vcpkg-binary-cache"
          .\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          .\vcpkg\vcpkg.exe install sdl3:x64-windows
      - name: Configure
        shell: pwsh
        run: cmake -S . -B build/package-windows -G "Visual Studio 17 2022" -A x64 -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" -DBUILD_TESTING=ON
      - name: Build Release
        run: cmake --build build/package-windows --config Release --parallel 4
      - name: CTest
        shell: pwsh
        run: |
          $env:PATH = "${{ github.workspace }}/vcpkg/installed/x64-windows/bin;$env:PATH"
          ctest --test-dir build/package-windows -C Release --output-on-failure
      - name: Package
        run: cpack --config build/package-windows/CPackConfig.cmake -C Release -B build/package-windows
      - name: Verify package contents
        shell: pwsh
        run: |
          $zip = 'build/package-windows/Extremis-RE-Windows.zip'
          if (-not (Test-Path $zip)) { throw "Missing $zip" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip))
          try {
            $names = @($archive.Entries | ForEach-Object { $_.FullName })
            foreach ($required in @('EXTREMIS-RE.exe', 'SDL3.dll', 'README.txt')) {
              if ($required -cnotin $names) { throw "Missing $required in $zip" }
            }
            if ($names | Where-Object { $_ -match '(^|/)(GAME\.LAB|EXTREMIS\.EXE|DATA)(/|$)' }) {
              throw 'Original game files found in Windows package'
            }
          } finally { $archive.Dispose() }
      - uses: actions/upload-artifact@v4
        with:
          name: Extremis-RE-Windows
          path: build/package-windows/Extremis-RE-Windows.zip
          if-no-files-found: error
